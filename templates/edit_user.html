{% extends "base.html" %}

{% block content %}
<h2>Редактирование пользователя</h2>

<div class="card mt-3">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" value="{{ user.email }}" disabled>
                <div class="form-text text-muted">Email нельзя изменить</div>
            </div>
            
            <div class="mb-3">
                <label for="name" class="form-label">Полное имя</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
            </div>
            
            <div class="mb-3">
                <label for="role" class="form-label">Роль</label>
                <select class="form-control" id="role" name="role" required onchange="toggleGroup()">
                    <option value="student" {% if user.role == 'student' %}selected{% endif %}>Студент</option>
                    <option value="teacher" {% if user.role == 'teacher' %}selected{% endif %}>Преподаватель</option>
                    <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Администратор</option>
                </select>
            </div>
            
            <div class="mb-3" id="groupField">
                <label for="group_id" class="form-label">Группа (для студентов)</label>
                <select class="form-control" id="group_id" name="group_id">
                    <option value="">Без группы</option>
                    {% for group in groups %}
                        <option value="{{ group.id }}" {% if user.group_id == group.id %}selected{% endif %}>
                            {{ group.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="mb-3">
                <label for="new_password" class="form-label">Новый пароль (оставьте пустым, чтобы не менять)</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="new_password" name="new_password">
                    <button type="button" class="btn btn-outline-secondary toggle-password">
                        <i class="bi bi-eye"></i> Показать
                    </button>
                </div>
                <div class="form-text text-muted">Минимум 4 символа</div>
            </div>
            
            <button type="submit" class="btn btn-primary">Сохранить изменения</button>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>

<script>
    function toggleGroup() {
        const role = document.getElementById('role').value;
        const groupField = document.getElementById('groupField');
        groupField.style.display = role === 'student' ? 'block' : 'none';
    }
    
    // Показать/скрыть пароль
    document.querySelectorAll('.toggle-password').forEach(button => {
        button.addEventListener('click', function() {
            const input = this.previousElementSibling;
            if (!input || input.tagName !== 'INPUT') return;
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            const icon = this.querySelector('i');
            if (type === 'password') {
                this.innerHTML = '<i class="bi bi-eye"></i> Показать';
            } else {
                this.innerHTML = '<i class="bi bi-eye-slash"></i> Скрыть';
            }
            if (icon) icon.className = type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
        });
    });
    
    toggleGroup();
</script>
{% endblock %}
