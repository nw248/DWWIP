{% extends "base.html" %}

{% block content %}
<h2>Добавить пользователя</h2>

<div class="card mt-3">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" name="password" required>
                    <button type="button" class="btn btn-outline-secondary toggle-password">
                        <i class="bi bi-eye"></i> Показать
                    </button>
                </div>
            </div>
            
            <div class="mb-3">
                <label for="name" class="form-label">Полное имя</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            
            <div class="mb-3">
                <label for="role" class="form-label">Роль</label>
                <select class="form-control" id="role" name="role" required onchange="toggleGroup()">
                    <option value="student">Студент</option>
                    <option value="teacher">Преподаватель</option>
                    <option value="admin">Администратор</option>
                </select>
            </div>
            
            <div class="mb-3" id="groupField">
                <label for="group_id" class="form-label">Группа (для студентов)</label>
                <select class="form-control" id="group_id" name="group_id">
                    <option value="">Без группы</option>
                    {% for group in groups %}
                        <option value="{{ group.id }}">{{ group.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary">Добавить</button>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>

<script>
    function toggleGroup() {
        const role = document.getElementById('role').value;
        const groupField = document.getElementById('groupField');
        groupField.style.display = role === 'student' ? 'block' : 'none';
    }
    
    // Показать/скрыть пароль
    document.querySelectorAll('.toggle-password').forEach(button => {
        button.addEventListener('click', function() {
            const input = this.previousElementSibling;
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            this.innerHTML = type === 'password' ? '<i class="bi bi-eye"></i> Показать' : '<i class="bi bi-eye-slash"></i> Скрыть';
            this.querySelector('i').className = type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
        });
    });
    
    toggleGroup();
</script>
{% endblock %}
