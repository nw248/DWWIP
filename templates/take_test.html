{% extends "base.html" %}

{% block content %}
<h2>{{ lesson.title }}</h2>
<p class="text-muted">{{ lesson.content }}</p>

<form method="POST" action="{{ url_for('take_test', lesson_id=lesson.id, group_id=group.id) }}">
    {% for question in questions %}
        <div class="card mb-4">
            <div class="card-body">
                <h5>Вопрос {{ loop.index }}: {{ question.text }}</h5>
                <div class="form-check mt-3">
                    <input class="form-check-input" type="radio" name="question_{{ question.id }}" value="A" id="q{{ question.id }}_a" required>
                    <label class="form-check-label" for="q{{ question.id }}_a">
                        A) {{ question.option_a }}
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="question_{{ question.id }}" value="B" id="q{{ question.id }}_b">
                    <label class="form-check-label" for="q{{ question.id }}_b">
                        B) {{ question.option_b }}
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="question_{{ question.id }}" value="C" id="q{{ question.id }}_c">
                    <label class="form-check-label" for="q{{ question.id }}_c">
                        C) {{ question.option_c }}
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="question_{{ question.id }}" value="D" id="q{{ question.id }}_d">
                    <label class="form-check-label" for="q{{ question.id }}_d">
                        D) {{ question.option_d }}
                    </label>
                </div>
            </div>
        </div>
    {% endfor %}
    
    <button type="submit" class="btn btn-primary">Завершить тест</button>
    <a href="{{ url_for('group_lesson', group_lesson_id=group_lesson_id) }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
