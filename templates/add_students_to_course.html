{% extends "base.html" %}

{% block content %}
<h2>Добавить группы к курсу "{{ course.title }}"</h2>

<form method="POST">
    <div class="mb-3">
        <label class="form-label">Выберите группы для курса</label>
        {% for group in all_groups %}
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="groups" value="{{ group.id }}" 
                       {% if group in current_groups %}checked{% endif %}>
                <label class="form-check-label">
                    {{ group.name }} ({{ group.students|length }} студентов)
                </label>
            </div>
        {% endfor %}
    </div>
    
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{{ url_for('course', course_id=course.id) }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
